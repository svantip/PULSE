# Configuration for urgency classifier

# Models to compare (list of model configurations)
MODELS:
  - NAME: "xlm-roberta-base"
    ALIAS: "xlm-roberta"
    DESCRIPTION: "XLM-RoBERTa - Optimized for multilingual tasks"
  - NAME: "bert-base-multilingual-cased"
    ALIAS: "bert-multilingual"
    DESCRIPTION: "BERT Multilingual - Baseline comparison model"

# Labels
NUM_LABELS: 3
LABELS:
  - "low"
  - "medium"
  - "high"

# Training configuration
TRAINING:
  LEARNING_RATE: 0.00003 # 3e-5
  BATCH_SIZE: 8
  EVAL_BATCH_SIZE: 16
  GRADIENT_ACCUMULATION_STEPS: 2
  NUM_EPOCHS: 5
  WEIGHT_DECAY: 0.01
  WARMUP_STEPS: 1000
  WARMUP_RATIO: 0.1
  MAX_LENGTH: 256 # Reduced from 512 for faster training
  LR_SCHEDULER_TYPE: "cosine"
  EARLY_STOPPING_PATIENCE: 3
  EARLY_STOPPING_THRESHOLD: 0.0001
  MAX_GRAD_NORM: 1.0
  EVAL_STEPS: 200
  SAVE_STEPS: 200
  LOGGING_STEPS: 100
  SAVE_TOTAL_LIMIT: 3
  DATALOADER_NUM_WORKERS: 2
  SEED: 42

# Class weight multipliers (applied after computing balanced weights)
CLASS_WEIGHTS:
  LOW: 1.3
  MEDIUM: 1.3
  HIGH: 0.9

# Model versioning
VERSIONING:
  ENABLED: true
  MLFLOW_TRACKING_URI: "./mlruns"
  EXPERIMENT_NAME: "urgency_classification"

# Data split ratios
DATA_SPLIT:
  TRAIN: 0.7
  VAL: 0.15
  TEST: 0.15

# Paths
PATHS:
  DATA: "data/clean.csv"
  MODELS: "trained_models"
  REPORTS: "reports"
