# Configuration for urgency classifier

# Models to compare (list of model configurations)
MODELS:
  - NAME: "roberta-base"
    ALIAS: "roberta"
    DESCRIPTION: "RoBERTa - Optimized for English text classification"
  - NAME: "bert-base-uncased"
    ALIAS: "bert"
    DESCRIPTION: "BERT Base Uncased - English baseline model"

# Labels
NUM_LABELS: 3
LABELS:
  - "low"
  - "medium"
  - "high"

# Training configuration
TRAINING:
  LEARNING_RATE: 0.00003 # 3e-5
  BATCH_SIZE: 16 # Increased for shorter texts
  EVAL_BATCH_SIZE: 32
  GRADIENT_ACCUMULATION_STEPS: 1
  NUM_EPOCHS: 4 # More epochs for better learning
  WEIGHT_DECAY: 0.01
  WARMUP_STEPS: 0
  WARMUP_RATIO: 0.1
  MAX_LENGTH: 192 # Reduced to 192 (text avg 267 chars)
  LR_SCHEDULER_TYPE: "cosine"
  EARLY_STOPPING_PATIENCE: 2
  EARLY_STOPPING_THRESHOLD: 0.001
  MAX_GRAD_NORM: 1.0
  EVAL_STEPS: 250
  SAVE_STEPS: 250
  LOGGING_STEPS: 100
  SAVE_TOTAL_LIMIT: 3
  DATALOADER_NUM_WORKERS: 4
  SEED: 42

# Class weight multipliers (balanced for stable training)
# Distribution: LOW 71%, MEDIUM 11%, HIGH 17%
# Using gentler multipliers to avoid training instability
CLASS_WEIGHTS:
  LOW: 0.7 # Gentle reduction for majority class (71%)
  MEDIUM: 1.5 # Conservative boost for minority class (11%)
  HIGH: 1.2 # Balanced weight for high (17%)

# Model versioning
VERSIONING:
  ENABLED: true
  MLFLOW_TRACKING_URI: "./mlruns"
  EXPERIMENT_NAME: "urgency_classification"

# Data split ratios
DATA_SPLIT:
  TRAIN: 0.7
  VAL: 0.15
  TEST: 0.15

# Paths
PATHS:
  DATA: "data/clean.csv"
  MODELS: "trained_models"
  REPORTS: "reports"
