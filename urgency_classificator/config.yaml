# Configuration for urgency classifier
MODEL_NAME: "distilbert-base-uncased"
NUM_LABELS: 4
LABELS:
  - "low"
  - "medium"
  - "high"
  - "critical"

# Training configuration
TRAINING:
  LEARNING_RATE: 2e-5
  BATCH_SIZE: 16
  NUM_EPOCHS: 3
  WEIGHT_DECAY: 0.01
  
# Model versioning
VERSIONING:
  ENABLED: true
  MLFLOW_TRACKING_URI: "./mlruns"
  EXPERIMENT_NAME: "urgency_classification"
